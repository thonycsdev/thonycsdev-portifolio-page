name: linter

on: pull_request

jobs:
  format:
    name: ESLint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: 'package.json'

      - run: bun install --frozen-lockfile
      - run: bun run lint

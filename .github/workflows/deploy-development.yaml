name: deploy-development

on:
  push:
    branches: [development]

concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/tests.yaml

  deploy:
    name: Deploy to Vercel (development)
    needs: test
    runs-on: ubuntu-latest
    environment: Development
    env:
      VERCEL_CLI: vercel@65.2.0
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Pull Vercel environment
        run: pnpm dlx $VERCEL_CLI pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - name: Run migrations
        run: >-
          pnpm exec dotenv --no-expand -e .vercel/.env.preview.local --
          sh -c 'PGHOST="$POSTGRES_HOST" PGPORT="${POSTGRES_PORT:-5432}"
          PGUSER="$POSTGRES_USER" PGPASSWORD="$POSTGRES_PASSWORD"
          PGDATABASE="$POSTGRES_DB" PGSSLMODE=require
          node-pg-migrate --migrations-dir ./infra/migrations up'
      - name: Build
        run: pnpm dlx $VERCEL_CLI build --token="$VERCEL_TOKEN"
      - name: Deploy
        run: pnpm dlx $VERCEL_CLI deploy --prebuilt --token="$VERCEL_TOKEN"

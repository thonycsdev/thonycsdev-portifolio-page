name: deploy

on:
  push:
    branches: [master, development]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/tests.yaml

  deploy:
    name: Deploy to Vercel
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'master' && 'Production' || 'Development' }}
    env:
      VERCEL_CLI: vercel@65.2.0
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ENVIRONMENT: ${{ github.ref_name == 'master' && 'production' || 'preview' }}
      VERCEL_PRODUCTION_FLAG: ${{ github.ref_name == 'master' && '--prod' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: 'package.json'

      - name: Pull Vercel environment
        run: bunx $VERCEL_CLI pull --yes --environment=$VERCEL_ENVIRONMENT --token="$VERCEL_TOKEN"
      - name: Build
        run: bunx $VERCEL_CLI build $VERCEL_PRODUCTION_FLAG --token="$VERCEL_TOKEN"
      - name: Deploy
        run: bunx $VERCEL_CLI deploy --prebuilt $VERCEL_PRODUCTION_FLAG --token="$VERCEL_TOKEN"
